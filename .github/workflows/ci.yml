name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Printers on the runner
        run: Get-Printer | Select-Object Name, DriverName | Format-Table -AutoSize
      - name: Tests
        run: python -m pytest -q tests
